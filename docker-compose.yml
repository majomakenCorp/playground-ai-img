# AI Playground — full stack (Next.js + MongoDB).
# Bring up:    docker compose up -d --build
# Tail logs:   docker compose logs -f app
# Tear down:   docker compose down              (preserves volumes)
# Wipe data:   docker compose down -v           (DESTRUCTIVE — drops Mongo data)

services:
  mongo:
    image: mongo:7
    container_name: playground-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks: [playground]
    # No `ports:` — Mongo is only reachable from the `app` container on the
    # private `playground` network. Add `ports: ["27017:27017"]` here if you
    # need a host-side GUI; do not commit that change.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playground-app
    restart: unless-stopped
    env_file: .env
    # Run as the host user so the bind-mounted ~/.claude (rw, for token
    # refresh) and ./generate-images keep matching ownership. Populate `.env`
    # with `HOST_UID=$(id -u)` / `HOST_GID=$(id -g)`.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3030}:3000"
    volumes:
      - ./generate-images:/app/generate-images
      # Claude Code CLI from the host (see docs/sdd-claude-provider.md §5.2).
      # The shebang at /usr/bin/claude is a symlink into /usr/lib/node_modules,
      # so both paths are mounted read-only — the app only invokes the binary.
      - /usr/bin/claude:/usr/local/bin/claude:ro
      - /usr/lib/node_modules/@anthropic-ai/claude-code:/usr/lib/node_modules/@anthropic-ai/claude-code:ro
      # Subscription credentials — read-write so the CLI can refresh tokens.
      - ${HOME}/.claude:/home/app/.claude
      # Main CLI config (sibling of .claude/, not inside it). Required — the
      # CLI errors out with "configuration file not found" if absent.
      - ${HOME}/.claude.json:/home/app/.claude.json
    environment:
      # CLI looks for credentials under $HOME/.claude.
      - HOME=/home/app
      # Absolute path used by src/lib/providers/claude-cli.ts.
      - CLAUDE_CLI_PATH=/usr/local/bin/claude
    networks: [playground]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo_data:

networks:
  playground:
    driver: bridge
